<script>const $=i=>document.getElementById(i);let PW='',D,cur='dash';
/*LOCAL*/let DATA;const nc_=c=>String(c==null?'':c).trim().replace(/^0+(?=\d)/,'');
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function mins_(t){const m=String(t||'').match(/(\d{1,2}):(\d{2})\s*([AaPp][Mm])?/);if(!m)return null;let h=+m[1];const a=(m[3]||'').toLowerCase();
 if(a==='pm'&&h<12)h+=12;if(a==='am'&&h===12)h=0;return h*60+ +m[2];}
function build_(s,X){const code=nc_(s.Code),sh=X.shifts[s.Shift]||{start:'09:30',end:'21:30'},S=mins_(sh.start),E=mins_(sh.end),
 offs=String(s.WeeklyOff||X.c.WeeklyOff||'Fri').split(/[ ,]+/),
 sum={work:0,present:0,late:0,absent:0,leave:0,holiday:0,off:0,incomplete:0,offduty:0,workMin:0,otMin:0},days=[];
 for(let d=1;d<=X.last;d++){const date=X.y+'-'+String(X.m).padStart(2,'0')+'-'+String(d).padStart(2,'0'),dw=DAYS[new Date(X.y,X.m-1,d).getDay()],
  a=X.att[date+'|'+code],lv=X.leaves.find(l=>l.code===code&&date>=l.from&&date<=l.to),hol=X.hol[date],off=offs.indexOf(dw)>=0,
  inM=a?mins_(a.in):null,outM=a?mins_(a.out):null,r={date,day:dw,in:a?a.in:'',out:a?a.out:'',st:'উপস্থিত',cls:'p',note:(a&&a.note)||'',mins:0};
  const span=()=>{if(inM===null||outM===null||outM===inM)return 0;let x=outM-inM;if(x<0)x+=1440;return x;};
  if(date>X.today){r.st='—';r.cls='f';}
  else if((hol||off)&&inM!==null){r.st='অফ-ডে ডিউটি';r.cls='d';sum.offduty++;r.mins=span();sum.workMin+=r.mins;sum.otMin+=r.mins;r.note=r.note||(hol||'সাপ্তাহিক ছুটিতে কাজ');}
  else if(hol){r.st='সরকারি ছুটি';r.cls='o';r.note=hol;sum.holiday++;}
  else if(off){r.st='সাপ্তাহিক ছুটি';r.cls='o';sum.off++;}
  else if(lv){r.st='ছুটি';r.cls='v';r.note=lv.type||'';sum.leave++;}
  else{sum.work++;
   if(inM===null){r.st='অনুপস্থিত';r.cls='a';sum.absent++;}
   else{sum.present++;
    if(inM>S+X.grace){sum.late++;r.st='দেরিতে';r.cls='l';r.note=r.note||('শিফটের '+(inM-S)+' মিনিট পরে');}
    if(outM===null||outM===inM){sum.incomplete++;r.st='অসম্পূর্ণ';r.cls='i';r.note=r.note||'আউট পাঞ্চ নেই';}
    else{r.mins=span();sum.workMin+=r.mins;if(outM>E)sum.otMin+=outM-E;else if(outM<E)r.note=r.note||'শিফটের আগে বের হয়েছেন';}}}
  days.push(r);}
 return{days,sum};}
function adminReport(p,code,month){auth_(p);const s=staff_(code);if(!s)throw new Error('স্টাফ পাওয়া যায়নি');
 const X=ctx_(month),b=build_(s,X),w=X.shifts[s.Shift]||{start:'09:30',end:'21:30'};
 return{org:X.c.OrgName,addr:X.c.Address,name:s.Name,code:String(s.Code),designation:s.Designation,branch:s.Branch,shift:w.start+' - '+w.end,grace:X.grace,days:b.days,sum:b.sum};}
function adminSummary(p,month,branch){auth_(p);const X=ctx_(month);
 const rows=rows_('Staff').filter(s=>String(s.Status||'Active').toLowerCase()!=='inactive'&&(!branch||s.Branch===branch))
  .map(s=>({code:String(s.Code),name:s.Name,designation:s.Designation,branch:s.Branch,sum:build_(s,X).sum}));
 return{org:X.c.OrgName,addr:X.c.Address,branch:branch||'সকল শাখা',rows};}
function adminDashboard(p,month){auth_(p);const X=ctx_(month),list=rows_('Staff').filter(active_),
 T={present:0,late:0,absent:0,leave:0,off:0},tot={work:0,present:0,late:0,absent:0,leave:0,otMin:0,off:0},daily={},br={},rows=[],late=[],abs=[],P=['p','l','i'];
 list.forEach(s=>{const b=build_(s,X),m=b.sum;['work','present','late','absent','leave','otMin'].forEach(k=>tot[k]+=m[k]);tot.off+=m.off+m.holiday;
  b.days.forEach(d=>{if(P.indexOf(d.cls)>=0)daily[d.date]=(daily[d.date]||0)+1;
   if(d.date===X.today){rows.push({name:s.Name,branch:s.Branch,in:d.in,out:d.out,st:d.st,cls:d.cls});
    if(P.concat('d').indexOf(d.cls)>=0)T.present++;if(d.cls==='l')T.late++;if(d.cls==='a')T.absent++;if(d.cls==='v')T.leave++;if(d.cls==='o')T.off++;}});
  const o=br[s.Branch]=br[s.Branch]||{b:s.Branch,work:0,present:0,staff:0};o.work+=m.work;o.present+=m.present;o.staff++;
  late.push({name:s.Name,n:m.late});abs.push({name:s.Name,n:m.absent});});
 const days=[];for(let d=1;d<=X.last;d++){const k=X.y+'-'+String(X.m).padStart(2,'0')+'-'+String(d).padStart(2,'0');if(k<=X.today)days.push({d,n:daily[k]||0});}
 const top=a=>a.filter(x=>x.n>0).sort((x,y)=>y.n-x.n).slice(0,5);
 return{org:X.c.OrgName,addr:X.c.Address,today:X.today,staff:list.length,T,tot,days,br:Object.keys(br).map(k=>br[k]),late:top(late),abs:top(abs),rows};}
const active_=s=>String(s.Status||'Active').toLowerCase()!=='inactive',auth_=()=>{},ctx_=()=>ctxL(),rows_=n=>rowsOf(n),staff_=c=>rowsOf('Staff').find(s=>nc_(s.Code)===nc_(c));
function rowsOf(n){const t=DATA.tabs[n];return t.rows.map(o=>{const x={};t.head.forEach((h,i)=>x[h]=o.v[i]);return x}).filter(x=>String(x[t.head[0]]).trim()!=='')}
function ctxL(){const [y,m]=DATA.month.split('-').map(Number),c={};rowsOf('Settings').forEach(r=>c[r.Key]=r.Value);
 const X={c,y,m,last:new Date(y,m,0).getDate(),hol:{},att:{},shifts:{},today:DATA.today,grace:Number(c.GraceMinutes)||0};
 rowsOf('Holidays').forEach(h=>X.hol[h.Date]=h.Name);X.leaves=rowsOf('Leaves').map(l=>({code:nc_(l.Code),from:l.From,to:l.To,type:l.Type}));
 rowsOf('Shifts').forEach(s=>X.shifts[s.Shift]={start:s.Start,end:s.End});DATA.att.forEach(a=>X.att[a.d+'|'+nc_(a.c)]=a);return X}

function toast(t,e){const m=$('msg');m.textContent=t;m.className=e?'e':'';m.style.display='block';setTimeout(()=>m.style.display='none',e?5000:1800)}

function load(cb){google.script.run.withFailureHandler(e=>toast(e.message||e,1)).withSuccessHandler(r=>{DATA=r;D.staff=rowsOf('Staff').filter(active_).map(s=>({code:String(s.Code),name:s.Name,branch:s.Branch}));D.branches=rowsOf('Branches').map(b=>b.Branch);cb&&cb()}).adminData(PW,$('mon').value)}

const dd=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function ear(p){const e=i=>(dd(p[i+1],p[i+5])+dd(p[i+2],p[i+4]))/(2*dd(p[i],p[i+3]));return(e(36)+e(42))/2}
function faceView(){ensure(()=>{const f=DATA.faces||[],b=$('br').value;$('v').innerHTML=`<div class="hint">কর্মীকে ক্যামেরার সামনে বসিয়ে সামনে তাকাতে বলুন, চোখ খোলা রেখে। ছবি সংরক্ষণ হয় না, শুধু মুখের সংখ্যাভিত্তিক বৈশিষ্ট্য থাকে। ✅ = নিবন্ধিত। নিবন্ধন করা কর্মীকে হাজিরার সময় চোখ পিটপিট করে মুখ মেলাতে হবে।</div><div class="card fm"><div><label>কর্মী</label><select id="st">${D.staff.filter(s=>!b||s.branch===b).map(s=>`<option value="${esc(s.code)}">${f.includes(s.code)?'✅ ':''}${esc(s.name)} (${esc(s.code)})</option>`).join('')}</select></div><button onclick="enrol()">📷 নিবন্ধন শুরু</button><button class="x" onclick="delFace()">নিবন্ধন মুছুন</button></div><div class="card" style="text-align:center"><video id="cam" autoplay playsinline muted style="width:320px;max-width:100%;transform:scaleX(-1);background:#111;border-radius:10px"></video><div id="cmsg" style="margin-top:8px;font-weight:700"></div></div>`})}
async function enrol(){const code=$('st').value,m=$('cmsg');if(!code)return;let st;
 try{m.textContent='ক্যামেরা ও মডেল লোড হচ্ছে...';await faceLib();st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:480},audio:false});const v=$('cam');v.srcObject=st;await v.play();
  const o=new faceapi.TinyFaceDetectorOptions({inputSize:224,scoreThreshold:.6}),S=[],t0=Date.now();let last=0;m.textContent='সামনে তাকান...';
  while(S.length<5&&Date.now()-t0<30000){const r=await faceapi.detectSingleFace(v,o).withFaceLandmarks().withFaceDescriptor();
   if(r&&ear(r.landmarks.positions)>.2&&Date.now()-last>600){S.push(Array.from(r.descriptor));last=Date.now();m.textContent='নেওয়া হয়েছে '+bn(S.length)+'/৫'}await new Promise(k=>setTimeout(k,60))}
  st.getTracks().forEach(x=>x.stop());v.srcObject=null;if(S.length<5)throw new Error('মুখ স্পষ্ট পাওয়া যায়নি, আবার চেষ্টা করুন');
  const avg=S[0].map((_,i)=>S.reduce((q,x)=>q+x[i],0)/S.length);
  call('adminSaveFace',[code,JSON.stringify(avg)],()=>{DATA=null;toast('মুখ নিবন্ধিত হয়েছে');faceView()})}catch(e){if(st)st.getTracks().forEach(x=>x.stop());m.textContent=e.message}}
